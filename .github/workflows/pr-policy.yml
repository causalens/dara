name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: causalens/pr-policy-action@f4bc8009cf525a6493bffda2b265d609a197f069 # v1.0.1
