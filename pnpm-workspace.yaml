packages:
  - "packages/**"
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
allowBuilds:
  '@fortawesome/fontawesome-common-types': true
  '@fortawesome/fontawesome-free': true
  '@fortawesome/fontawesome-svg-core': true
  '@fortawesome/free-brands-svg-icons': true
  '@fortawesome/free-regular-svg-icons': true
  '@fortawesome/free-solid-svg-icons': true
  cypress: true
  esbuild: true
  msw: true
  nx: true
minimumReleaseAgeExclude:
  - "@darajs/*"
packageExtensions:
  '@cl/styled-components':
    dependencies:
      react-dom: ^18.2
  styled-components:
    dependencies:
      react-is: ^18.2
  '@darajs/ui-components':
    dependencies:
      '@fortawesome/fontawesome-svg-core': ~6.4.0
  react-markdown:
    dependencies:
      '@types/react': 18.2.60
patchedDependencies:
  tinykeys: patches/tinykeys.patch
overrides:
  brace-expansion@<2: '>=1.1.18 <2'
  brace-expansion@>=2 <3: '>=2.1.4 <3'
  brace-expansion@>=5 <6: '>=5.0.9 <6'
  fast-uri@>=3 <4: '>=3.1.5 <4'
  ip-address@>=10 <11: '>=10.3.1 <11'
  js-yaml@>=3 <4: '>=3.15.1 <4'
  js-yaml@>=4 <5: '>=4.3.1 <5'
  nanoid@>=3 <4: '>=3.3.18 <4'
  nx@>=22 <23: '>=22.7.7 <23'
  postcss@>=8 <9: '>=8.5.23 <9'
  react-router@>=7 <8: '>=7.18.2 <8'
  tar@>=7 <8: '>=7.5.21 <8'
  form-data: '>=4.0.4 <5'
  tmp: '>=0.2.7 <0.3'
  lodash: '>=4.18.1 <5'
  minimatch@>=10: '>=10.2.5 <11'
  qs: '>=6.15.2 <7'
linkWorkspacePackages: true
shamefullyHoist: true
