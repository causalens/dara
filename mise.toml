min_version = "2026.9.0"

monorepo_root = true

[tools]
python = "3.10"
uv = "0.11"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[monorepo]
config_roots = ["packages/*"]
lockfile = true

[tasks.uv-sync]
description = "Recreate the workspace venv from uv.lock"
run = "uv sync --locked --all-packages --all-groups --all-extras"

[tasks.uv-lock-check]
description = "Fail if uv.lock is out of date with the pyprojects"
run = "uv lock --check"

# Python package tasks, aggregated from each package's mise.toml (previously `poetry anthology run <script>`)
[tasks.lint]
run = "mise run '//packages/...:lint'"

[tasks.format]
run = "mise run '//packages/...:format'"

[tasks.format-check]
run = "mise run '//packages/...:format-check'"

[tasks.test]
# Sequential: each package already runs pytest -n auto and the pool tests must not overlap.
run = "mise run --jobs 1 '//packages/...:test'"

[tasks.security-scan]
run = "mise run '//packages/...:security-scan'"

[tasks.package]
description = "Build wheels for the publishable Python packages"
run = "mise run '//packages/...:package'"

# JavaScript tasks. Per-package lint/format/test tasks wrap the package.json scripts and
# run in parallel; builds and publishing stay on lerna for topological ordering.
[tasks.deps-project]
description = "Install JS dependencies with a frozen lockfile"
run = "pnpm install --frozen-lockfile && if [ -f .npmrc ]; then sed -i '$ d' .npmrc; fi"

[tasks.prepare]
description = "Build all JS packages for release packaging"
run = "pnpm lerna run build"

[tasks.prepare-dev]
description = "Build JS packages in development mode"
run = "pnpm lerna run prepare-dev"

[tasks.lint-js]
run = "mise run '//packages/...:lint-js'"

[tasks.bearer-install]
description = "Install bearer into ./bin if missing"
run = "test -f ./bin/bearer || curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- v1.39.0"

[tasks.bearer]
description = "JS security scan"
run = "mise run '//packages/...:bearer'"

[tasks.test-js]
description = "Run JS tests across all packages"
run = "mise run '//packages/...:test-js'"

[tasks.format-js]
run = "mise run '//packages/...:format-js'"

[tasks.format-js-check]
run = "mise run '//packages/...:format-js-check'"

# Release tasks (previously Makefile publish/version targets)
[tasks.publish-python]
run = "./tooling/scripts/publish-python.sh"

# Native pnpm packing applies publishConfig exports; versions already in the registry are skipped.
# Extra arguments are forwarded, e.g. `mise run publish-npm -- --dry-run`.
[tasks.publish-npm]
run = "rm -f .npmrc && pnpm --recursive --sort --workspace-concurrency 1 publish --no-git-checks"

[tasks.publish]
description = "Publish Python wheels and npm packages"
depends = ["publish-python", "publish-npm"]

[tasks.publish-docs]
run = "./tooling/scripts/publish-docs.sh"

# Accepts an exact version (used by the release workflow) or patch/minor/major
# (bumps JS via lerna and Python pyprojects in lockstep, like the old make targets).
[tasks.version-bump-python]
run = "./tooling/scripts/bump_python_versions.sh"

[tasks.version-patch]
run = ["./tooling/scripts/bump_python_versions.sh patch", "mise run lock-frontends"]

[tasks.version-minor]
run = ["./tooling/scripts/bump_python_versions.sh minor", "mise run lock-frontends"]

[tasks.version-major]
run = ["./tooling/scripts/bump_python_versions.sh major", "mise run lock-frontends"]

# Reconcile committed app catalogs after the Python/npm release version changes.
[tasks.lock-frontends]
run = [
  "cd packages/demo-app && uv run --locked dara lock",
  "cd packages/dara-core/cypress/app && PYTHONPATH=../.. uv run --locked --project ../.. dara lock",
]

# Check real packed distributions and browser behavior without publishing.
[tasks.release-check]
depends = ["prepare"]
run = "uv run --locked python tooling/scripts/check_frontend_release.py --browser"

[tasks.update-ui-deps]
run = "pnpm --recursive --latest update @darajs/styled-components @darajs/eslint-config @darajs/oxfmt-config @darajs/oxlint-config @darajs/prettier-config @darajs/stylelint-config @darajs/ui-causal-graph-editor @darajs/ui-code-editor @darajs/ui-components @darajs/ui-hierarchy-viewer @darajs/ui-icons @darajs/ui-notifications @darajs/ui-utils @darajs/ui-widgets"

[tasks.clean]
run = "git clean -xfd ."