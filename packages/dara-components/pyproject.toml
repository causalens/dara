[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dara-components"
version = "1.29.10"
description = "Components for the Dara Framework"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Patricia Jacob", email = "patricia@causalens.com" },
    { name = "Krzysztof Bielikowicz", email = "krzysztof@causalens.com" },
    { name = "Sam Smith", email = "sam@causalens.com" },
]
urls = { Homepage = "https://dara.causalens.com/", Repository = "https://github.com/causalens/dara" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10.0,<3.13.0"
dependencies = [
    "bokeh==3.1.1",
    "cai-causal-graph>=0.3.6",
    "certifi>=2024.7.4",
    "dara-core==1.29.10",
    "dill>=0.3.0,<0.4.0",
    "matplotlib>=2.0.0",
    "pandas>=1.1.0,<3.0.0",
    "plotly>=5.14.0,<5.15.0",
    "scipy",
    "seaborn>=0.11.0",
]

[project.entry-points."dara_assets"]
dara-components = "dara.components._assets:asset_manifest"

[tool.uv.sources]
dara-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["dara"]
# Wheels ship only the committed common assets; legacy auto_js bundles stay out.
exclude = ["dara/components/_assets/auto_js"]

[dependency-groups]
dev = [
    "bandit>=1.7.5,<2.0.0",
    "pyright>=1.1.400,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff==0.16.0",
]