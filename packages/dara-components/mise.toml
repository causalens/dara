[tasks.lint]
run = "uv run --locked --package dara-components --group dev pyright ./dara && uv run --locked --package dara-components --group dev ruff check ."

[tasks.format]
run = "uv run --locked --package dara-components --group dev ruff check --select I --fix --unsafe-fixes . && uv run --locked --package dara-components --group dev ruff format ."

[tasks.format-check]
run = "uv run --locked --package dara-components --group dev ruff check --select I . && uv run --locked --package dara-components --group dev ruff format --check ."

[tasks.security-scan]
run = "uv run --locked --package dara-components --group dev bandit dara -r -ll -i"

[tasks.test]
run = "uv run --locked --package dara-components --group dev pytest tests -n auto -v"

[tasks.package]
run = "uv build --package dara-components --wheel"