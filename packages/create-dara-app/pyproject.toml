[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "create-dara-app"
version = "1.29.10"
description = "CLI to quickly bootstrap a Dara app"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Krzysztof Bielikowicz", email = "krzysztof@causalens.com" }]
urls = { Homepage = "https://dara.causalens.com/", Repository = "https://github.com/causalens/dara" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10.0,<3.13.0"
dependencies = [
    "certifi>=2024.7.4",
    "click>=8.1.3,<9.0.0",
    "cookiecutter>=2.1.1,<3.0.0",
]

[project.scripts]
create-dara-app = "create_dara_app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["create_dara_app"]

[dependency-groups]
dev = [
    "bandit>=1.7.5,<2.0.0",
    "pyright>=1.1.400,<2.0.0",
    "ruff==0.16.0",
    "types-requests>=2.28.1,<3.0.0",
]

[tool.blue]
line-length = 120