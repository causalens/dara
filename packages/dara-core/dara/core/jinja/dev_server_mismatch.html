<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta content="2" http-equiv="refresh" />
        <title>Dara dev server mismatch</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Manrope, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                display: grid;
                place-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 1.5rem;
                background: #f8f9ff;
                color: #1e244d;
            }

            main {
                width: min(44rem, 100%);
                padding: 1.5rem;
                border-radius: 1rem;
                background: #fbfcff;
                box-shadow: 0 2px 10px rgb(0 0 0 / 10%);
            }

            header {
                display: flex;
                gap: 0.75rem;
                align-items: center;
            }

            .status-icon {
                display: grid;
                flex: 0 0 auto;
                place-items: center;
                width: 2rem;
                height: 2rem;
                color: #da6087;
                font-size: 1.25rem;
                font-weight: 700;
            }

            .brand {
                margin: 0 0 0.25rem;
                color: #434b87;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                color: #1e244d;
                font-size: clamp(1.25rem, 4vw, 1.5rem);
                line-height: 1.25;
            }

            .content {
                margin-top: 1.5rem;
            }

            .message-label {
                margin: 0 0 0.75rem;
                color: #5b5e66;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            pre {
                margin: 0;
                padding: 1.25rem;
                overflow-wrap: anywhere;
                border-radius: 0.25rem;
                background: #eef1fa;
                color: #1e244d;
                font: 0.875rem/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
                white-space: pre-wrap;
            }

            footer {
                margin-top: 1.5rem;
                color: #5b5e66;
                font-size: 0.8125rem;
            }

            @media (max-width: 32rem) {
                header {
                    align-items: flex-start;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <div aria-hidden="true" class="status-icon">!</div>
                <div>
                    <p class="brand">Dara development</p>
                    <h1>Development server mismatch</h1>
                </div>
            </header>
            <div class="content">
                <p class="message-label">How to fix this</p>
                <pre>{{ message }}</pre>
            </div>
            <footer>
                <span>Waiting for a matching server at {{ origin }}. This page retries automatically.</span>
            </footer>
        </main>
    </body>
</html>
