<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta content="2" http-equiv="refresh" />
        <title>Dara dev server mismatch</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Manrope, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                display: grid;
                place-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 1.5rem;
                background: #f8f9ff;
                color: #1e244d;
            }

            main {
                width: min(44rem, 100%);
                padding: 1.5rem;
                border-radius: 1rem;
                background: #fbfcff;
                box-shadow: 0 2px 10px rgb(0 0 0 / 10%);
            }

            header {
                display: flex;
                gap: 0.875rem;
                align-items: center;
            }

            .status-icon {
                flex: 0 0 auto;
                width: 1.5rem;
                height: 1.5rem;
                color: #da4167;
            }

            h1 {
                margin: 0;
                color: #1e244d;
                font-size: clamp(1.25rem, 4vw, 1.5rem);
                line-height: 1.25;
            }

            .content {
                margin-top: 1.5rem;
            }

            .message {
                margin: 0;
                overflow-wrap: anywhere;
                color: #1e244d;
                font-size: 0.9375rem;
                line-height: 1.65;
                white-space: pre-wrap;
            }

            footer {
                margin-top: 1.5rem;
                color: #5b5e66;
                font-size: 0.8125rem;
            }

            @media (max-width: 32rem) {
                header {
                    align-items: flex-start;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <svg aria-hidden="true" class="status-icon" viewBox="0 0 512 512">
                    <path
                        d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c14.3 24.4-3.3 55.2-31.5 55.2H37c-28.2 0-45.8-30.8-31.5-55.2l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24v112c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0-64 0 32 32 0 1 0 64 0z"
                        fill="currentColor"
                    />
                </svg>
                <h1>Development server mismatch</h1>
            </header>
            <div class="content">
                <div class="message">{{ message }}</div>
            </div>
            <footer>
                <span>Waiting for a matching server at {{ origin }}. This page retries automatically.</span>
            </footer>
        </main>
    </body>
</html>
