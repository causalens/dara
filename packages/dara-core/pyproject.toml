[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dara-core"
version = "1.29.10"
description = "Dara Framework Core"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sam Smith", email = "sam@causalens.com" },
    { name = "Krzysztof Bielikowicz", email = "krzysztof@causalens.com" },
]
urls = { Homepage = "https://dara.causalens.com/", Repository = "https://github.com/causalens/dara" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10.0,<3.13.0"
dependencies = [
    "aiorwlock>=1.4.0,<2.0.0",
    "anyio>=4.0.0",
    "async-asgi-testclient>=1.4.11,<2.0.0",
    "backoff>=2.2.1,<3.0.0",
    "cachetools>=5.0.0",
    "certifi>=2024.7.4",
    "click>=8.1.3,<9.0.0",
    "colorama>=0.4.6,<0.5.0",
    "create-dara-app==1.29.10",
    "croniter>=6.0.0,<7.0.0",
    "cryptography>=42.0.4",
    "exceptiongroup>=1.1.3,<2.0.0",
    "fastapi>=0.136.3,<0.137.0",
    "fastapi_vite_dara==0.4.0",
    "h11>=0.16.0",
    "httpx>=0.23.0",
    "jinja2>=2.1.1,<3.2.0",
    "jsonpatch>=1.33",
    "logfire[fastapi,httpx,system-metrics]>=4.39.0,<5.0.0",
    "odfpy",
    "openpyxl",
    "opentelemetry-exporter-prometheus>=0.65b0,<0.66",
    "opentelemetry-instrumentation-logging>=0.65b0,<0.66",
    "packaging>=23.1",
    "pandas>=1.1.0,<3.0.0",
    "platformdirs>=4.0.0,<5.0.0",
    "prometheus-client>=0.14.1,<1.0.0",
    "pyarrow",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "pyjwt>=2.3.0,<3.0.0",
    "python-dotenv>=0.19.2",
    "python-multipart>=0.0.7",
    "pyxlsb",
    "responses>=0.18.0,<0.19.0",
    "starlette>=1.0.1",
    "tblib>=1.7.0,<2.0.0",
    "toml>=0.10.2,<0.11.0",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.23.1",
    "xlrd",
]

[project.optional-dependencies]
all = ["dara-components==1.29.10"]

[project.scripts]
dara = "dara.core.cli:cli"

[project.entry-points."dara_assets"]
dara-core = "dara.core._assets:asset_manifest"

[project.entry-points."pydoc_markdown.interfaces.Renderer"]
docusaurus_internal = "docusaurus_internal:DocusaurusRenderer"

[tool.uv.sources]
create-dara-app = { workspace = true }
dara-components = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["dara"]

[dependency-groups]
dev = [
    "bandit>=1.7.5,<2.0.0",
    "freezegun>=1.2.2,<2.0.0",
    "google-auth>=2.37.0,<3.0.0",
    "pyright>=1.1.400,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "requests>=2.25.1,<3.0.0",
    "respx>=0.22.0,<0.23.0",
    "ruff==0.16.0",
    "types-cachetools>=6.0.0.20250525,<7.0.0.0",
    "types-croniter>=1.0.10,<2.0.0",
    "types-requests>=2.27.29,<3.0.0",
]

[tool.pytest.ini_options]
timeout = 300
markers = [
    "pool: worker pool tests, should not be used with xdist"
]