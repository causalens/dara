[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-app"
version = "1.29.10"
description = "Demo App"
authors = [{ name = "Author", email = "author@example.com" }]
requires-python = ">=3.10.0,<3.13.0"
dependencies = [
    "dara-core",
    "dara-components",
]

[tool.uv.sources]
dara-core = { workspace = true }
dara-components = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["demo_app"]

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2.0.0",
    "ruff==0.16.0",
]